name: Run Kulturadar UI speed fix

on:
  push:
    paths:
      - '.github/workflows/run-kulturadar-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/run_fix_wrapper.py
      - name: Commit changes
        run: |
          git config user.name XGAMERSTORE
          git config user.email 73636097+XGAMERSTORE@users.noreply.github.com
          git add app/src/main/java/cz/kulturadar/app
          git commit -m "Collapse filters, fix image fallbacks and speed up sources"
          git push
