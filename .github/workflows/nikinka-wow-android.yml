name: Nikinka WOW Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'nikinka-wow/**'
      - '.github/workflows/nikinka-wow-android.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: nikinka-wow
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Nikinka-WOW-APK
          path: nikinka-wow/app/build/outputs/apk/debug/app-debug.apk
