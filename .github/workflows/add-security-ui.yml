name: Add Kulturadar security UI

on:
  push:
    paths:
      - '.github/workflows/add-security-ui.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add security section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/cz/kulturadar/app/ui/KulturadarProApp.kt')
          s = p.read_text()
          old = '        item { Text("Kulturadar 2.1 · vše zdarma", color = MaterialTheme.colorScheme.onSurfaceVariant) }'
          new = '''        item {
            Text("Bezpečnost a podpora", fontSize = 20.sp, fontWeight = FontWeight.Bold)
            Text("Našel jsi bezpečnostní chybu, problém se soukromím nebo podezřelé chování? Napiš nám přímo na bezpečnostní kontakt.", color = MaterialTheme.colorScheme.onSurfaceVariant)
            Spacer(Modifier.height(8.dp))
            Text("xghelpdesk@gmail.com", color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.Bold)
            Spacer(Modifier.height(8.dp))
            OutlinedButton(
                onClick = {
                    val mail = Uri.parse("mailto:xghelpdesk@gmail.com?subject=Kulturadar%20-%20bezpečnostní%20hlášení")
                    context.startActivity(Intent(Intent.ACTION_SENDTO, mail))
                },
                modifier = Modifier.fillMaxWidth()
            ) {
                Icon(Icons.Default.Security, null)
                Spacer(Modifier.width(7.dp))
                Text("Nahlásit bezpečnostní problém")
            }
        }
        item { Text("Kulturadar 1.0 · vše zdarma", color = MaterialTheme.colorScheme.onSurfaceVariant) }'''
          if old not in s:
              raise SystemExit('settings footer not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit
        run: |
          git config user.name XGAMERSTORE
          git config user.email 73636097+XGAMERSTORE@users.noreply.github.com
          git add app/src/main/java/cz/kulturadar/app/ui/KulturadarProApp.kt
          git commit -m "Add security contact to Kulturadar settings"
          git push
