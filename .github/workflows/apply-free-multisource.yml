name: Apply free multisource migration

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[auto-free]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove Premium branding and wire public sources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Wire the public no-key aggregator into the existing repository.
          p = Path('app/src/main/java/cz/kulturadar/app/data/EventRepository.kt')
          s = p.read_text()
          if 'private val publicSources = PublicEventSourcesRepository()' not in s:
              s = s.replace(
                  '    private val goOut = GoOutRepository()\n',
                  '    private val goOut = GoOutRepository()\n    private val publicSources = PublicEventSourcesRepository()\n'
              )
          if 'val publicResult = publicSources.load(city, keyword)' not in s:
              s = s.replace(
                  '        val goOutResult = goOut.load(city, keyword)\n        val ticketResult =',
                  '        val goOutResult = goOut.load(city, keyword)\n        val publicResult = publicSources.load(city, keyword)\n        val ticketResult ='
              )
          s = s.replace(
              '        val merged = (goOutResult.events + ticketResult.events)',
              '        val merged = (goOutResult.events + publicResult.events + ticketResult.events)'
          )
          p.write_text(s)

          # 2) Make every feature free and remove visible Premium branding.
          p = Path('app/src/main/java/cz/kulturadar/app/ui/KulturadarProApp.kt')
          s = p.read_text()
          s = s.replace('import cz.kulturadar.app.BuildConfig\n', '')
          s = s.replace('    val premium = BuildConfig.INTERNAL_PREMIUM\n', '    val premium = true // all features are free\n')
          premium_badge = '''                    if (premium) { Spacer(Modifier.width(8.dp)); Surface(color = MaterialTheme.colorScheme.primaryContainer, shape = RoundedCornerShape(9.dp)) { Text("PREMIUM", Modifier.padding(7.dp, 3.dp), color = MaterialTheme.colorScheme.primary, fontSize = 9.sp, fontWeight = FontWeight.Black) } }\n'''
          s = s.replace(premium_badge, '')
          premium_card = '''        item {\n            Surface(shape = RoundedCornerShape(24.dp), color = MaterialTheme.colorScheme.primaryContainer, modifier = Modifier.fillMaxWidth()) {\n                Column(Modifier.padding(18.dp), verticalArrangement = Arrangement.spacedBy(7.dp)) {\n                    Row(verticalAlignment = Alignment.CenterVertically) { Icon(Icons.Default.WorkspacePremium, null, tint = MaterialTheme.colorScheme.primary); Spacer(Modifier.width(8.dp)); Text("Premium aktivní", fontSize = 21.sp, fontWeight = FontWeight.Black) }\n                    Text("Smart řazení podle toho, co ukládáš, vzdálenost, cenové filtry, víkendové tipy, náhodný tip, offline cache a rychlé plánování.", color = MaterialTheme.colorScheme.onSurfaceVariant)\n                }\n            }\n        }\n'''
          s = s.replace(premium_card, '')
          s = s.replace(
              'GoOut funguje bez API. Ticketmaster je pouze volitelný doplňkový zdroj.',
              'GoOut + více než 20 veřejných kalendářů funguje bez API. Ticketmaster je jen volitelný doplněk.'
          )
          s = s.replace('Kulturadar 2.0', 'Kulturadar 2.1 · vše zdarma')
          p.write_text(s)

          # 3) No Premium build switch remains in the app configuration.
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('        versionCode = 9', '        versionCode = 10')
          s = s.replace('        versionName = "2.0.0"', '        versionName = "2.1.0"')
          s = s.replace('        buildConfigField("boolean", "INTERNAL_PREMIUM", "true")\n', '')
          p.write_text(s)
          PY

      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/cz/kulturadar/app/data/EventRepository.kt \
                  app/src/main/java/cz/kulturadar/app/ui/KulturadarProApp.kt \
                  app/build.gradle.kts
          git commit -m "[auto-free] Make Kulturadar free and enable 20+ public sources"
          git push
